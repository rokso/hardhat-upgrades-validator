name: Dependencies latest

# The plugin uses Hardhat's build system and artifacts API, and slotdiff and a
# few OpenZeppelin upgrades-core internals, all through semver ranges. A new
# release inside a range that breaks one would break every install; this finds
# out before users do.
on:
  schedule:
    # Mondays 16:30 UTC, after Scorecard.
    - cron: "30 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The newest versions package.json allows, as a fresh install gets them.
      - run: pnpm update hardhat slotdiff @openzeppelin/upgrades-core
      - run: node -p "['hardhat', 'slotdiff', '@openzeppelin/upgrades-core'].map((p) => p + ' ' + require(p + '/package.json').version).join('\n')"
      - run: pnpm fixtures
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node --input-type=module -e "await import('./dist/index.js'); await import('./dist/proxy/validate-proxy.js')"
